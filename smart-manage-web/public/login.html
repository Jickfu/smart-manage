<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- 内联登录脚本使用固定 SHA-256 摘要授权，脚本内容变化时必须同步更新摘要。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-A9DvQeVL/qZ8dtfpwLtS7MvN9I12F04KE5fHvsrhPYk='; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Smart Manage - 登录</title>
    <script src="js/sm2.js"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="sm-login">
      <section id="loginBanner" class="sm-login-banner" aria-label="登录页宣传图"></section>

      <section class="sm-login-panel" aria-label="登录表单">
        <div class="sm-language">简体中文</div>
        <div class="sm-logo-container">
          <img id="loginLogo" class="sm-logo" src="logo.svg" alt="系统标识" />
        </div>
        <div class="sm-login-card">
          <div class="sm-login-card-item">
            <div id="loginTitle" class="sm-login-title">Smart Manage 账号登录</div>
            <div id="errorMsg" class="sm-error-msg" role="alert">
              <svg class="sm-error-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM12 8v5M12 16h.01"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span id="errorMsgText" class="sm-error-text"></span>
              <button
                id="errorMsgClose"
                class="sm-error-close"
                type="button"
                aria-label="关闭错误提示"
              >
                ×
              </button>
            </div>

            <form id="loginForm" class="sm-form" autocomplete="on">
              <div class="sm-input-wrap">
                <svg class="sm-input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="username"
                  class="sm-input"
                  type="text"
                  placeholder="用户名"
                  autocomplete="username"
                />
              </div>

              <div class="sm-input-wrap">
                <svg class="sm-input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v10H6V11Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="password"
                  class="sm-input"
                  type="password"
                  placeholder="登录密码"
                  autocomplete="current-password"
                />
              </div>

              <div class="sm-form-extra">
                <button id="forgotPasswordBtn" class="sm-link-button" type="button">
                  忘记密码
                </button>
              </div>

              <button id="loginBtn" class="sm-login-btn" type="submit">登录</button>
            </form>

            <form id="passwordChangeForm" class="sm-form" autocomplete="off" hidden>
              <div class="sm-input-wrap">
                <svg class="sm-input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v10H6V11Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="newPassword"
                  class="sm-input"
                  type="password"
                  placeholder="新密码"
                  autocomplete="new-password"
                />
              </div>
              <div class="sm-input-wrap">
                <svg class="sm-input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v10H6V11Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="confirmPassword"
                  class="sm-input"
                  type="password"
                  placeholder="确认新密码"
                  autocomplete="new-password"
                />
              </div>
              <button id="changePasswordBtn" class="sm-login-btn" type="submit">确认修改</button>
              <button id="backToLoginBtn" class="sm-secondary-btn" type="button">返回登录</button>
            </form>

            <form id="emailRecoveryForm" class="sm-form" autocomplete="off" hidden>
              <div class="sm-input-wrap">
                <svg class="sm-input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 5h18v14H3V5Zm0 1 9 7 9-7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="recoveryEmail"
                  class="sm-input"
                  type="email"
                  placeholder="完整邮箱"
                  autocomplete="email"
                />
              </div>
              <button id="sendRecoveryCodeBtn" class="sm-login-btn" type="submit">
                发送邮箱验证码
              </button>
              <div class="sm-recovery-links">
                <button id="switchPhoneRecoveryBtn" class="sm-link-button" type="button">
                  通过手机找回
                </button>
                <button id="backFromRecoveryBtn" class="sm-link-button" type="button">
                  &lt; 返回账号登录
                </button>
              </div>
            </form>

            <form id="emailResetForm" class="sm-form" autocomplete="off" hidden>
              <p id="recoveryEmailHint" class="sm-recovery-hint"></p>
              <div class="sm-input-wrap">
                <input
                  id="recoveryCode"
                  class="sm-input sm-input--plain"
                  type="text"
                  inputmode="numeric"
                  maxlength="6"
                  placeholder="6位邮箱验证码"
                  autocomplete="one-time-code"
                />
              </div>
              <div class="sm-input-wrap">
                <input
                  id="recoveryNewPassword"
                  class="sm-input sm-input--plain"
                  type="password"
                  placeholder="新密码（至少8位）"
                  autocomplete="new-password"
                />
              </div>
              <div class="sm-input-wrap">
                <input
                  id="recoveryConfirmPassword"
                  class="sm-input sm-input--plain"
                  type="password"
                  placeholder="确认新密码"
                  autocomplete="new-password"
                />
              </div>
              <button id="resetPasswordByEmailBtn" class="sm-login-btn" type="submit">
                重置密码
              </button>
              <div class="sm-recovery-links">
                <button id="resendRecoveryCodeBtn" class="sm-link-button" type="button">
                  重新发送验证码
                </button>
                <button id="backFromResetBtn" class="sm-link-button" type="button">
                  &lt; 返回账号登录
                </button>
              </div>
            </form>
          </div>
        </div>
        <div class="sm-psv"></div>
        <div class="sm-footer">备案信息</div>
      </section>
    </main>

    <div
      id="captchaModal"
      class="sm-captcha-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="captchaModalTitle"
      hidden
    >
      <section class="sm-captcha-dialog">
        <header class="sm-captcha-header">
          <div id="captchaModalTitle" class="sm-captcha-title">安全验证</div>
          <button
            id="captchaCloseBtn"
            class="sm-captcha-close"
            type="button"
            aria-label="关闭滑块验证"
          >
            ×
          </button>
        </header>
        <div class="sm-captcha-body">
          <canvas
            id="captchaCanvas"
            class="sm-captcha-canvas"
            width="300"
            height="180"
            aria-label="滑块拼图"
          ></canvas>
          <canvas
            id="captchaSlider"
            class="sm-captcha-slider"
            width="300"
            height="46"
            tabindex="0"
            aria-label="按住滑块向右拖动完成拼图"
          ></canvas>
          <div id="captchaStatus" class="sm-captcha-status" aria-live="polite">正在加载验证...</div>
          <button id="captchaRefreshBtn" class="sm-link-button sm-captcha-refresh" type="button">
            刷新验证
          </button>
        </div>
      </section>
    </div>

    <script>
      var SM2_PUBLIC_KEY =
        '0405102042204d15e802522ea09eb609358e4c72295e0ca44727eef75faac9afb3eeaa3e9df5af87e205e6ce5cb351e4fb30c37602f32aad969d2b222f05f8fa99';
      var API_BASE = '/smart-manage-api';

      var captchaChallenge = null;
      var captchaLoading = false;
      var captchaDragging = false;
      var captchaStartTime = 0;
      var captchaLeft = 0;
      var captchaDragStartX = 0;
      var captchaDragStartY = 0;
      var captchaDragStartLeft = 0;
      var captchaTrack = [];
      var captchaBackgroundImage = new Image();
      var captchaTemplateImage = new Image();
      var passwordChangeTicket = '';
      var defaultLoginTitle = '';
      var captchaPurpose = 'login';
      var recoveryEmail = '';

      var loginLogoEl = document.getElementById('loginLogo');
      var loginTitleEl = document.getElementById('loginTitle');
      var usernameEl = document.getElementById('username');
      var passwordEl = document.getElementById('password');
      var captchaModalEl = document.getElementById('captchaModal');
      var captchaCanvasEl = document.getElementById('captchaCanvas');
      var captchaSliderEl = document.getElementById('captchaSlider');
      var captchaStatusEl = document.getElementById('captchaStatus');
      var captchaCloseBtnEl = document.getElementById('captchaCloseBtn');
      var captchaRefreshBtnEl = document.getElementById('captchaRefreshBtn');
      var errorMsgEl = document.getElementById('errorMsg');
      var errorMsgTextEl = document.getElementById('errorMsgText');
      var errorMsgCloseEl = document.getElementById('errorMsgClose');
      var loginBtnEl = document.getElementById('loginBtn');
      var forgotPasswordBtnEl = document.getElementById('forgotPasswordBtn');
      var loginFormEl = document.getElementById('loginForm');
      var passwordChangeFormEl = document.getElementById('passwordChangeForm');
      var newPasswordEl = document.getElementById('newPassword');
      var confirmPasswordEl = document.getElementById('confirmPassword');
      var changePasswordBtnEl = document.getElementById('changePasswordBtn');
      var backToLoginBtnEl = document.getElementById('backToLoginBtn');
      var emailRecoveryFormEl = document.getElementById('emailRecoveryForm');
      var emailResetFormEl = document.getElementById('emailResetForm');
      var recoveryEmailEl = document.getElementById('recoveryEmail');
      var recoveryCodeEl = document.getElementById('recoveryCode');
      var recoveryNewPasswordEl = document.getElementById('recoveryNewPassword');
      var recoveryConfirmPasswordEl = document.getElementById('recoveryConfirmPassword');
      var recoveryEmailHintEl = document.getElementById('recoveryEmailHint');
      var sendRecoveryCodeBtnEl = document.getElementById('sendRecoveryCodeBtn');
      var resetPasswordByEmailBtnEl = document.getElementById('resetPasswordByEmailBtn');
      var switchPhoneRecoveryBtnEl = document.getElementById('switchPhoneRecoveryBtn');
      var backFromRecoveryBtnEl = document.getElementById('backFromRecoveryBtn');
      var resendRecoveryCodeBtnEl = document.getElementById('resendRecoveryCodeBtn');
      var backFromResetBtnEl = document.getElementById('backFromResetBtn');
      var bannerEl = document.getElementById('loginBanner');

      /** 获取并校验重定向 URL — 使用 URL 解析器严格校验同源，防止开放重定向攻击 */
      function getSafeRedirectUrl() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (!redirect) return '';
        // URLSearchParams.get() 已执行一次解码，redirect 为原始值
        try {
          var target = new URL(redirect, location.origin);
          // 严格同源校验
          if (target.origin !== location.origin) {
            return '';
          }
          return target.pathname + target.search + target.hash;
        } catch (_e) {
          // 解析异常（非法 URL）返回默认页
          return '';
        }
      }

      function normalizeAssetUrl(url, fallback) {
        if (!url || !url.trim()) {
          return fallback;
        }
        var value = url.trim();
        if (value.indexOf('/upload/') === 0) {
          return API_BASE + value;
        }
        if (value.indexOf('upload/') === 0) {
          return API_BASE + '/' + value;
        }
        if (value.indexOf('/sys/base/ui-config/image/') === 0) {
          return API_BASE + value;
        }
        if (
          /^(https?:)?\/\//.test(value) ||
          value.indexOf('data:') === 0 ||
          value.charAt(0) === '/'
        ) {
          return value;
        }
        return '/' + value;
      }

      function showError(msg) {
        errorMsgEl.classList.remove('is-success');
        errorMsgTextEl.textContent = msg;
        errorMsgEl.classList.add('is-visible');
      }

      function showSuccess(msg) {
        errorMsgEl.classList.add('is-success');
        errorMsgTextEl.textContent = msg;
        errorMsgEl.classList.add('is-visible');
      }

      function hideError() {
        errorMsgTextEl.textContent = '';
        errorMsgEl.classList.remove('is-visible', 'is-success');
      }

      function applyUiConfig(config) {
        var systemName = config.systemName;
        var pageTitle = config.pageTitle || systemName;
        var loginTitle = systemName.indexOf('登录') >= 0 ? systemName : systemName + ' 账号登录';
        defaultLoginTitle = loginTitle;
        document.title = pageTitle + ' - 登录';
        loginTitleEl.textContent = loginTitle;
        loginLogoEl.src = normalizeAssetUrl(config.loginLogo, 'logo.svg');
        loginLogoEl.alt = systemName;
        bannerEl.style.backgroundImage =
          'url("' + normalizeAssetUrl(config.loginBanner, 'default-login-banner.png') + '")';
      }

      function loadUiConfig() {
        fetch(API_BASE + '/sys/base/ui-config/active', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code === 0 && result.data) {
              applyUiConfig(result.data);
            }
          })
          .catch(function () {
            // 登录页配置失败不阻断登录，页面保留内置默认品牌资源。
          });
      }

      function setCaptchaStatus(message, state) {
        captchaStatusEl.textContent = message;
        captchaStatusEl.classList.toggle('is-error', state === 'error');
        captchaStatusEl.classList.toggle('is-success', state === 'success');
      }

      function drawCaptcha() {
        var context = captchaCanvasEl.getContext('2d');
        context.clearRect(0, 0, captchaCanvasEl.width, captchaCanvasEl.height);
        if (!captchaChallenge) return;
        context.drawImage(
          captchaBackgroundImage,
          0,
          0,
          captchaCanvasEl.width,
          captchaCanvasEl.height,
        );
        var templateWidth = getCaptchaTemplateWidth();
        context.drawImage(
          captchaTemplateImage,
          captchaLeft,
          0,
          templateWidth,
          captchaCanvasEl.height,
        );
      }

      function drawCaptchaSlider() {
        var context = captchaSliderEl.getContext('2d');
        var handleWidth = 46;
        context.clearRect(0, 0, captchaSliderEl.width, captchaSliderEl.height);
        context.fillStyle = '#f5f7fa';
        context.fillRect(0, 0, captchaSliderEl.width, captchaSliderEl.height);
        context.strokeStyle = '#d9d9d9';
        context.strokeRect(0.5, 0.5, captchaSliderEl.width - 1, captchaSliderEl.height - 1);
        context.fillStyle = captchaDragging ? '#e6f4ff' : '#ffffff';
        context.fillRect(captchaLeft, 0, handleWidth, captchaSliderEl.height);
        context.strokeStyle = '#1677ff';
        context.strokeRect(captchaLeft + 0.5, 0.5, handleWidth - 1, captchaSliderEl.height - 1);
        context.fillStyle = '#1677ff';
        context.font = '22px Arial';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText('›', captchaLeft + handleWidth / 2, captchaSliderEl.height / 2);
        if (!captchaDragging && captchaLeft === 0) {
          context.fillStyle = '#667085';
          context.font = '14px Arial';
          context.fillText('按住滑块，拖动完成拼图', 174, captchaSliderEl.height / 2);
        }
      }

      function getCaptchaTemplateWidth() {
        if (!captchaChallenge) return 0;
        return Math.round(
          (captchaChallenge.templateImageWidth * captchaCanvasEl.width) /
            captchaChallenge.backgroundImageWidth,
        );
      }

      function loadImage(image, source) {
        return new Promise(function (resolve, reject) {
          image.onload = resolve;
          image.onerror = reject;
          image.src = source;
        });
      }

      function resetCaptchaInteraction() {
        captchaDragging = false;
        captchaStartTime = 0;
        captchaLeft = 0;
        captchaDragStartX = 0;
        captchaDragStartY = 0;
        captchaDragStartLeft = 0;
        captchaTrack = [];
        drawCaptchaSlider();
      }

      function loadCaptchaChallenge() {
        if (captchaLoading) return;
        captchaLoading = true;
        captchaChallenge = null;
        resetCaptchaInteraction();
        setCaptchaStatus('正在加载验证...', '');
        fetch(API_BASE + '/sys/base/captcha/challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: getCaptchaIdentity() }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code !== 0 || !result.data) {
              throw new Error(result.msg || '获取滑块验证失败');
            }
            captchaChallenge = result.data;
            return Promise.all([
              loadImage(captchaBackgroundImage, result.data.backgroundImage),
              loadImage(captchaTemplateImage, result.data.templateImage),
            ]);
          })
          .then(function () {
            drawCaptcha();
            drawCaptchaSlider();
            setCaptchaStatus('请拖动滑块完成拼图', '');
          })
          .catch(function (error) {
            captchaChallenge = null;
            setCaptchaStatus(error.message || '网络异常，获取滑块验证失败', 'error');
          })
          .finally(function () {
            captchaLoading = false;
          });
      }

      function getCaptchaIdentity() {
        return captchaPurpose === 'email-recovery'
          ? recoveryEmailEl.value.trim()
          : usernameEl.value.trim();
      }

      function openCaptchaModal(purpose) {
        captchaPurpose = purpose || 'login';
        captchaModalEl.hidden = false;
        setCaptchaActionLoading(true);
        loadCaptchaChallenge();
        captchaSliderEl.focus();
      }

      function closeCaptchaModal() {
        captchaModalEl.hidden = true;
        captchaChallenge = null;
        resetCaptchaInteraction();
        setCaptchaActionLoading(false);
      }

      function setCaptchaActionLoading(loading) {
        if (captchaPurpose === 'email-recovery') {
          sendRecoveryCodeBtnEl.disabled = loading;
          resendRecoveryCodeBtnEl.disabled = loading;
          sendRecoveryCodeBtnEl.textContent = loading ? '验证中...' : '发送邮箱验证码';
        } else {
          setLoginLoading(loading);
        }
      }

      function pointerPosition(event) {
        var bounds = captchaSliderEl.getBoundingClientRect();
        return {
          x: ((event.clientX - bounds.left) * captchaSliderEl.width) / bounds.width,
          y: ((event.clientY - bounds.top) * captchaSliderEl.height) / bounds.height,
        };
      }

      function recordCaptchaPoint(position, type) {
        captchaTrack.push({
          // 验证库按首尾轨迹位移计算结果，因此轨迹必须以实际按下点为原点。
          x: position.x - captchaDragStartX,
          y: position.y - captchaDragStartY,
          t: Date.now() - captchaStartTime,
          type: type,
        });
      }

      function startCaptchaDrag(event) {
        if (!captchaChallenge || captchaLoading || captchaDragging) return;
        var position = pointerPosition(event);
        if (position.x > 56) return;
        captchaDragging = true;
        captchaStartTime = Date.now();
        captchaDragStartX = position.x;
        captchaDragStartY = position.y;
        captchaDragStartLeft = captchaLeft;
        captchaTrack = [];
        captchaSliderEl.setPointerCapture(event.pointerId);
        recordCaptchaPoint(position, 'down');
        drawCaptchaSlider();
      }

      function moveCaptchaDrag(event) {
        if (!captchaDragging) return;
        var position = pointerPosition(event);
        var maxLeft = captchaSliderEl.width - getCaptchaTemplateWidth();
        // 使用真实拖动增量，避免从滑块非中心位置按下时出现视觉位置与校验位移不一致。
        captchaLeft = Math.max(
          0,
          Math.min(maxLeft, Math.round(captchaDragStartLeft + position.x - captchaDragStartX)),
        );
        recordCaptchaPoint(position, 'move');
        drawCaptcha();
        drawCaptchaSlider();
      }

      function stopCaptchaDrag(event) {
        if (!captchaDragging) return;
        var position = pointerPosition(event);
        recordCaptchaPoint(position, 'up');
        captchaDragging = false;
        drawCaptchaSlider();
        verifyCaptcha(Date.now());
      }

      function verifyCaptcha(stopTime) {
        var challenge = captchaChallenge;
        if (!challenge) return;
        captchaLoading = true;
        setCaptchaStatus('正在校验...', '');
        fetch(API_BASE + '/sys/base/captcha/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: getCaptchaIdentity(),
            challengeId: challenge.challengeId,
            track: {
              backgroundImageWidth: captchaCanvasEl.width,
              backgroundImageHeight: captchaCanvasEl.height,
              templateImageWidth: getCaptchaTemplateWidth(),
              templateImageHeight: captchaCanvasEl.height,
              startTime: captchaStartTime,
              stopTime: stopTime,
              left: captchaLeft,
              top: 0,
              trackList: captchaTrack,
            },
          }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code !== 0 || !result.data || !result.data.captchaTicket) {
              throw new Error(result.msg || '滑块验证失败');
            }
            setCaptchaStatus('验证成功', 'success');
            captchaModalEl.hidden = true;
            captchaChallenge = null;
            if (captchaPurpose === 'email-recovery') {
              submitRecoveryCodeRequest(result.data.captchaTicket);
            } else {
              submitLogin(result.data.captchaTicket);
            }
          })
          .catch(function (error) {
            setCaptchaStatus(error.message || '滑块验证失败，请重试', 'error');
            window.setTimeout(loadCaptchaChallenge, 1000);
          })
          .finally(function () {
            captchaLoading = false;
          });
      }

      function redirectToApplication() {
        var redirect = getSafeRedirectUrl();
        window.location.replace(redirect || '/index.html?app=home');
      }

      function checkExistingSession() {
        fetch(API_BASE + '/sys/base/session')
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code === 0 && result.data) {
              redirectToApplication();
            }
          })
          .catch(function () {
            // 会话检查失败不阻断用户使用登录表单。
          });
      }

      function setLoginLoading(loading) {
        loginBtnEl.disabled = loading;
        loginBtnEl.textContent = loading ? '登录中...' : '登录';
      }

      function showPasswordChange(ticket) {
        passwordChangeTicket = ticket;
        defaultLoginTitle = defaultLoginTitle || loginTitleEl.textContent;
        loginTitleEl.textContent = '首次登录修改密码';
        loginFormEl.hidden = true;
        emailRecoveryFormEl.hidden = true;
        emailResetFormEl.hidden = true;
        passwordChangeFormEl.hidden = false;
        passwordEl.value = '';
        hideError();
        newPasswordEl.focus();
      }

      function showLoginForm(successMessage) {
        passwordChangeTicket = '';
        newPasswordEl.value = '';
        confirmPasswordEl.value = '';
        passwordChangeFormEl.hidden = true;
        emailRecoveryFormEl.hidden = true;
        emailResetFormEl.hidden = true;
        loginFormEl.hidden = false;
        loginTitleEl.textContent = defaultLoginTitle || 'Smart Manage 账号登录';
        if (successMessage) {
          showSuccess(successMessage);
        } else {
          hideError();
        }
        passwordEl.focus();
      }

      function showEmailRecoveryForm() {
        defaultLoginTitle = defaultLoginTitle || loginTitleEl.textContent;
        loginTitleEl.textContent = '邮箱找回密码';
        loginFormEl.hidden = true;
        passwordChangeFormEl.hidden = true;
        emailResetFormEl.hidden = true;
        emailRecoveryFormEl.hidden = false;
        hideError();
        recoveryEmailEl.focus();
      }

      function requestRecoveryCode() {
        var email = recoveryEmailEl.value.trim();
        if (!email || !recoveryEmailEl.checkValidity()) {
          showError('请输入有效的完整邮箱');
          recoveryEmailEl.focus();
          return;
        }
        hideError();
        openCaptchaModal('email-recovery');
      }

      function submitRecoveryCodeRequest(captchaTicket) {
        recoveryEmail = recoveryEmailEl.value.trim();
        fetch(API_BASE + '/sys/base/login/password/email/code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: recoveryEmail, captchaTicket: captchaTicket }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code !== 0) throw new Error(result.msg || '验证码发送失败');
            emailRecoveryFormEl.hidden = true;
            emailResetFormEl.hidden = false;
            recoveryEmailHintEl.textContent =
              '如果账号存在且已绑定该邮箱，6位验证码已发送到 ' +
              recoveryEmail +
              '，请在10分钟内完成重置。';
            showSuccess(result.data || '验证码发送请求已受理');
            recoveryCodeEl.focus();
          })
          .catch(function (error) {
            showError(error.message || '网络异常，验证码发送失败');
          })
          .finally(function () {
            setCaptchaActionLoading(false);
          });
      }

      function resetPasswordByEmail() {
        var code = recoveryCodeEl.value.trim();
        var newPassword = recoveryNewPasswordEl.value;
        var confirmPassword = recoveryConfirmPasswordEl.value;
        if (!/^\d{6}$/.test(code)) {
          showError('请输入6位邮箱验证码');
          recoveryCodeEl.focus();
          return;
        }
        if (newPassword.length < 8) {
          showError('新密码不能少于8位');
          recoveryNewPasswordEl.focus();
          return;
        }
        if (newPassword !== confirmPassword) {
          showError('两次输入的密码不一致');
          recoveryConfirmPasswordEl.focus();
          return;
        }
        resetPasswordByEmailBtnEl.disabled = true;
        resetPasswordByEmailBtnEl.textContent = '重置中...';
        fetch(API_BASE + '/sys/base/login/password/email/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: recoveryEmail,
            code: code,
            newPassword: sm2.doEncrypt(newPassword, SM2_PUBLIC_KEY, 1),
          }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code !== 0) throw new Error(result.msg || '密码重置失败');
            recoveryCodeEl.value = '';
            recoveryNewPasswordEl.value = '';
            recoveryConfirmPasswordEl.value = '';
            showLoginForm('密码重置成功，请使用新密码登录');
          })
          .catch(function (error) {
            showError(error.message || '网络异常，密码重置失败');
          })
          .finally(function () {
            resetPasswordByEmailBtnEl.disabled = false;
            resetPasswordByEmailBtnEl.textContent = '重置密码';
          });
      }

      function setPasswordChangeLoading(loading) {
        changePasswordBtnEl.disabled = loading;
        backToLoginBtnEl.disabled = loading;
        changePasswordBtnEl.textContent = loading ? '修改中...' : '确认修改';
      }

      function changePassword() {
        var newPassword = newPasswordEl.value;
        var confirmPassword = confirmPasswordEl.value;
        if (!newPassword) {
          showError('请输入新密码');
          newPasswordEl.focus();
          return;
        }
        if (newPassword !== confirmPassword) {
          showError('两次输入的密码不一致');
          confirmPasswordEl.focus();
          return;
        }
        if (!passwordChangeTicket) {
          showError('改密凭证已失效，请返回登录后重试');
          return;
        }

        hideError();
        setPasswordChangeLoading(true);
        var encryptedNewPassword = sm2.doEncrypt(newPassword, SM2_PUBLIC_KEY, 1);
        fetch(API_BASE + '/sys/base/login/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ticket: passwordChangeTicket,
            newPassword: encryptedNewPassword,
          }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (result.code === 0) {
              showLoginForm('密码修改成功，请使用新密码重新登录');
              return;
            }
            passwordChangeTicket = '';
            showError(result.msg || '密码修改失败，请返回登录后重试');
          })
          .catch(function () {
            passwordChangeTicket = '';
            showError('网络异常，密码修改失败，请返回登录后重试');
          })
          .finally(function () {
            setPasswordChangeLoading(false);
          });
      }

      function login() {
        var username = usernameEl.value.trim();
        var password = passwordEl.value;

        if (!username) {
          showError('请输入用户名');
          usernameEl.focus();
          return;
        }
        if (!password) {
          showError('请输入密码');
          passwordEl.focus();
          return;
        }
        hideError();
        openCaptchaModal('login');
      }

      function submitLogin(captchaTicket) {
        var username = usernameEl.value.trim();
        var password = passwordEl.value;

        // SM2 C1C3C2 模式加密密码，滑块票据本身是短时高熵一次性凭证。
        var encryptedPassword = sm2.doEncrypt(password, SM2_PUBLIC_KEY, 1);

        fetch(API_BASE + '/sys/base/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            password: encryptedPassword,
            captchaTicket: captchaTicket,
          }),
        })
          .then(function (res) {
            return res.json();
          })
          .then(function (result) {
            if (
              result.code === 0 &&
              result.data &&
              result.data.passwordReset &&
              result.data.passwordChangeTicket
            ) {
              showPasswordChange(result.data.passwordChangeTicket);
              return;
            }
            if (result.code === 0 && result.data && result.data.authenticated) {
              redirectToApplication();
              return;
            }
            showError((result.data && result.data.msg) || result.msg || '登录失败');
          })
          .catch(function () {
            showError('网络异常，登录失败');
          })
          .finally(function () {
            setCaptchaActionLoading(false);
          });
      }

      // 页面初始化
      loadUiConfig();
      checkExistingSession();

      // 事件绑定
      usernameEl.addEventListener('input', function () {
        hideError();
      });
      captchaSliderEl.addEventListener('pointerdown', startCaptchaDrag);
      captchaSliderEl.addEventListener('pointermove', moveCaptchaDrag);
      captchaSliderEl.addEventListener('pointerup', stopCaptchaDrag);
      captchaSliderEl.addEventListener('pointercancel', stopCaptchaDrag);
      captchaCloseBtnEl.addEventListener('click', closeCaptchaModal);
      captchaRefreshBtnEl.addEventListener('click', loadCaptchaChallenge);
      errorMsgCloseEl.addEventListener('click', hideError);
      forgotPasswordBtnEl.addEventListener('click', function () {
        showEmailRecoveryForm();
      });
      loginFormEl.addEventListener('submit', function (event) {
        event.preventDefault();
        login();
      });
      passwordChangeFormEl.addEventListener('submit', function (event) {
        event.preventDefault();
        changePassword();
      });
      backToLoginBtnEl.addEventListener('click', function () {
        showLoginForm('');
      });
      emailRecoveryFormEl.addEventListener('submit', function (event) {
        event.preventDefault();
        requestRecoveryCode();
      });
      emailResetFormEl.addEventListener('submit', function (event) {
        event.preventDefault();
        resetPasswordByEmail();
      });
      resendRecoveryCodeBtnEl.addEventListener('click', function () {
        recoveryEmailEl.value = recoveryEmail;
        requestRecoveryCode();
      });
      switchPhoneRecoveryBtnEl.addEventListener('click', function () {
        showError('暂不支持通过手机找回密码');
      });
      backFromRecoveryBtnEl.addEventListener('click', function () {
        showLoginForm('');
      });
      backFromResetBtnEl.addEventListener('click', function () {
        showLoginForm('');
      });
    </script>
  </body>
</html>
