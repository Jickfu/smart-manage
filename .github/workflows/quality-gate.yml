name: Quality Gate

# 质量验证只读取仓库；禁止依赖仓库外的默认令牌权限。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-manage-web/pnpm-lock.yaml
      - name: Install frontend dependencies for AST conventions
        working-directory: smart-manage-web
        run: pnpm install --frozen-lockfile
      - name: Verify module conventions
        shell: pwsh
        run: ./scripts/verify-module-conventions.ps1
      - name: Verify workflow security policy
        run: node --test scripts/workflow-security.test.mjs
      - name: Verify baseline cleanup safety
        shell: pwsh
        run: ./scripts/verify-baseline.tests.ps1
      - name: Verify deployment key generator
        run: node --test scripts/generate-deployment-keys.test.mjs

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ['', '-Pplatform-only']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Remove optional domain for platform-only verification
        if: matrix.profile == '-Pplatform-only'
        run: find smart-manage-server/domains -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: Test and package backend
        run: mvn -f smart-manage-server/pom.xml --batch-mode --no-transfer-progress ${{ matrix.profile }} verify

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ['current', 'platform-only']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: smart-manage-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: smart-manage-web
        run: pnpm install --frozen-lockfile
      - name: Remove optional frontend domain for platform-only verification
        if: matrix.mode == 'platform-only'
        run: find smart-manage-web/src/domain -mindepth 1 -maxdepth 1 -type d ! -name sys ! -name common -exec rm -rf {} +
      - name: Generate selected registries
        working-directory: smart-manage-web
        run: pnpm gen:registry
      - name: Lint
        working-directory: smart-manage-web
        run: pnpm lint
      - name: Check formatting
        working-directory: smart-manage-web
        run: pnpm format:check
      - name: Test
        working-directory: smart-manage-web
        run: pnpm test
      - name: Build
        working-directory: smart-manage-web
        run: pnpm build
      - name: Verify default registries are committed
        if: matrix.mode == 'current'
        run: git diff --exit-code -- smart-manage-web/src/domain/common/registry/registry.gen.ts smart-manage-web/src/domain/common/registry/applicationHomes.gen.ts

  migrations:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        selection: ['', '-PlatformOnly']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install PostgreSQL Client 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          psql --version
      - name: Verify migrations from an empty database
        shell: pwsh
        run: ./scripts/verify-baseline.ps1 ${{ matrix.selection }}
