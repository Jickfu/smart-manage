spring:
  application:
    name: smart-manage
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
  task:
    execution:
      thread-name-prefix: async-task-
    scheduling:
      thread-name-prefix: scheduling-task-
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: SmartManageScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.tablePrefix: QRTZ_

server:
  shutdown: graceful
  servlet:
    context-path: /smart-manage-api

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

jetcache:
  areaInCacheName: false
  decodeFilterAllowPatterns:
    - sm.
  local:
    default:
      type: caffeine
      keyConvertor: jackson

sa-token:
  token-name: smtoken
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-write-header: false
  is-lasting-cookie: true
  is-concurrent: true
  is-share: false
  token-style: random-64
  # Sa-Token 内置事件日志会输出完整会话 token，所有环境统一关闭并使用项目受控认证审计日志。
  is-log: false
  cookie:
    path: /
    http-only: true
    same-site: Lax

smart-manage:
  system:
    security:
      no-need-login: /sys/base/login,/sys/base/captcha/challenge,/sys/base/captcha/verify
    openapi:
      # 加密信封和解密后响应分别限流，避免认证入口被超大报文耗尽内存。
      max-envelope-bytes: 1048576
      max-response-bytes: 2097152
    log:
      thread-name-prefix: biz-log-
