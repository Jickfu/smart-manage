server:
  port: 8080
  compression:
    enabled: true
  tomcat:
    max-connections: 100
    threads:
      max: 200
      min-spare: 20
    accept-count: 10
    connection-timeout: 20000

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 2592000
          cache-public: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 500KB
      resolve-lazily: false
  task:
    execution:
      pool:
        core-size: 4
        max-size: 4
        queue-capacity: 100
        keep-alive: 60s
    scheduling:
      pool:
        size: 4
  quartz:
    properties:
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 10
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${SMART_MANAGE_DB_URL:jdbc:postgresql://localhost:5432/smart_manage}
    username: ${SMART_MANAGE_DB_USERNAME:postgres}
    # 仅用于本地开发的公开默认凭据；生产环境由 application-prod.yml 强制从环境变量注入。
    password: ${SMART_MANAGE_DB_PASSWORD:postgres}
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 100
      max-wait: 30000
      test-while-idle: true
      test-on-borrow: true
      test-on-return: true
      validation-query: SELECT 1
      validation-query-timeout: 3000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      remove-abandoned: true
      # Druid 使用毫秒；开发环境允许任务持有连接最多 5 分钟后再判定为遗弃。
      remove-abandoned-timeout-millis: 300000
      keep-alive: true
      filters: stat
      filter:
        stat:
          enabled: true
          merge-sql: true
          # 页面直接读取内存统计，禁止把可能包含参数的慢 SQL 重复输出到日志。
          log-slow-sql: false
          slow-sql-millis: 2000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${SMART_MANAGE_DRUID_USERNAME:druid}
        login-password: ${SMART_MANAGE_DRUID_PASSWORD:druid}
        allow: 127.0.0.1
  data:
    redis:
      host: ${SMART_MANAGE_REDIS_HOST:127.0.0.1}
      port: ${SMART_MANAGE_REDIS_PORT:6379}
      password: ${SMART_MANAGE_REDIS_PASSWORD:redis123}
      database: ${SMART_MANAGE_REDIS_DATABASE:1}
      timeout: 1000ms
      jedis:
        pool:
          max-active: 100
          max-idle: 10
          min-idle: 2

jetcache:
  statIntervalMinutes: 15
  local:
    default:
      limit: 10000
      expireAfterWriteInMillis: 1800000
  remote:
    default:
      type: redis
      keyConvertor: jackson
      host: ${SMART_MANAGE_REDIS_HOST:127.0.0.1}
      port: ${SMART_MANAGE_REDIS_PORT:6379}
      password: ${SMART_MANAGE_REDIS_PASSWORD:redis123}
      database: ${SMART_MANAGE_REDIS_DATABASE:1}
      timeout: 1000
      poolConfig:
        maxTotal: 100
        maxIdle: 10
        minIdle: 2

sa-token:
  timeout: 86400
  active-timeout: 18000
  cookie:
    secure: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  path: /scalar

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  file:
    name: logs/smart-manage.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 5GB

smart-manage:
  infrastructure:
    http:
      connect-timeout: 3s
      request-timeout: 10s
    cors:
      allowed-origins:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
    trusted-proxy:
      cidrs:
        - 127.0.0.1/32
        - ::1/128
  system:
    runtime:
      instance-id: ${SMART_MANAGE_INSTANCE_ID:instance1}
    upload:
      dir: ${SMART_MANAGE_UPLOAD_DIR:./smfiles/}
    security:
      argon2:
        iterations: 2
        memory: 65536
        parallelism: 1
      sm4:
        # 公开开发密钥，仅用于本地开发和演示；生产环境禁止复用。
        key-base64: ${SMART_MANAGE_SM4_KEY:c21hcnQtbWFuYWdlLWRldg==}
      sm2:
        js:
          # 开发密钥与 login.html 的公开开发公钥配套，禁止在生产环境复用。
          private-key: ${SMART_MANAGE_SM2_PRIVATE_KEY:00dc349799de9b5a3beef8d3d77aa7e3655c5542a10c395cc86670580b6250dfeb}
          public-key: ${SMART_MANAGE_SM2_PUBLIC_KEY:0405102042204d15e802522ea09eb609358e4c72295e0ca44727eef75faac9afb3eeaa3e9df5af87e205e6ce5cb351e4fb30c37602f32aad969d2b222f05f8fa99}
    log:
      core-pool-size: 10
      max-pool-size: 20
      queue-capacity: 1000
      keep-alive-seconds: 60
  domain:
    sys:
      monitor:
        # host-id 表示 Smart Manage 认知中的运行主机；缺省时使用稳定 hostname。
        host-id: ${SMART_MANAGE_HOST_ID:}
        sampling:
          interval-ms: 10000
          snapshot-ttl-seconds: 40
        history:
          interval-ms: 60000
          retention-days: ${SMART_MANAGE_MONITOR_RETENTION_DAYS:7}
          cleanup-cron: "0 20 3 * * *"
        alert:
          evaluation-interval-ms: 10000
          notification-interval-ms: 10000
        cluster:
          internal-base-url: ${SMART_MANAGE_INTERNAL_BASE_URL:http://127.0.0.1:8080/smart-manage-api}
          require-https: false
          heartbeat-interval-ms: 10000
          catalog-refresh-interval-ms: 300000
          instance-ttl-ms: 30000
          request-timeout-ms: 10000
