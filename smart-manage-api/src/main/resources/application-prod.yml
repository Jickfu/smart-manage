server:
  port: ${SMART_MANAGE_SERVER_PORT:8080}

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${SMART_MANAGE_DB_URL}
    username: ${SMART_MANAGE_DB_USERNAME}
    password: ${SMART_MANAGE_DB_PASSWORD}
    druid:
      initial-size: ${SMART_MANAGE_DB_POOL_INITIAL_SIZE:5}
      min-idle: ${SMART_MANAGE_DB_POOL_MIN_IDLE:10}
      # 按“单实例上限 × 实例数”核算 PostgreSQL 总连接数。
      max-active: ${SMART_MANAGE_DB_POOL_MAX_ACTIVE:30}
      max-wait: 30000
      test-while-idle: true
      validation-query: SELECT 1
      validation-query-timeout: 3000
      filters: stat
      filter:
        stat:
          enabled: true
          merge-sql: true
          log-slow-sql: false
          slow-sql-millis: ${SMART_MANAGE_SLOW_SQL_MILLIS:2000}
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  data:
    redis:
      host: ${SMART_MANAGE_REDIS_HOST}
      port: ${SMART_MANAGE_REDIS_PORT:6379}
      password: ${SMART_MANAGE_REDIS_PASSWORD}
      database: ${SMART_MANAGE_REDIS_DATABASE:1}
      timeout: 1000ms

jetcache:
  remote:
    default:
      type: redis
      keyConvertor: jackson
      host: ${SMART_MANAGE_REDIS_HOST}
      port: ${SMART_MANAGE_REDIS_PORT:6379}
      password: ${SMART_MANAGE_REDIS_PASSWORD}
      database: ${SMART_MANAGE_REDIS_DATABASE:1}
      timeout: 1000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

scalar:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  server:
    add-application-context-header: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [${smart-manage.instance-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [${smart-manage.instance-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    sm: INFO

smart-manage:
  instance-id: ${SMART_MANAGE_INSTANCE_ID}
  framework:
    cors:
      allowed-origins:
        - ${SMART_MANAGE_CORS_ALLOWED_ORIGIN}
    trusted-proxy:
      # 生产必须设置为 Nginx/负载均衡器实际网段，禁止使用 0.0.0.0/0。
      cidrs: ${SMART_MANAGE_TRUSTED_PROXY_CIDRS}
  security:
    initial-administrator-password: ${SMART_MANAGE_INITIAL_ADMINISTRATOR_PASSWORD}
    sm4:
      key-base64: ${SMART_MANAGE_SM4_KEY}
  system:
    upload:
      # 单实例使用 Local 时必须指向持久化并纳入备份的目录；S3/FTP 模式不会读取该目录。
      dir: ${SMART_MANAGE_UPLOAD_DIR:./upload/}
  monitor:
    cluster:
      # 每个实例必须配置其他应用实例可直接访问的内部地址，禁止填写公网入口或负载均衡地址。
      internal-base-url: ${SMART_MANAGE_INTERNAL_BASE_URL}
      require-https: true
      heartbeat-interval-ms: 10000
      instance-ttl-ms: 30000
      request-timeout-ms: 10000
  sm2:
    js:
      private-key: ${SMART_MANAGE_SM2_PRIVATE_KEY}
      public-key: ${SMART_MANAGE_SM2_PUBLIC_KEY}
